[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connectocopter"
version = "0.1.0"
description = "A FlyWire whole-brain connectome model driving a simulated hybrid FPV quadcopter / ground rover"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Connectocopter contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14",
  "scipy>=1.11",
  "torch>=2.3",
  "mujoco>=3.2",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "brian2>=2.6", "joblib>=1.3"]

[project.scripts]
connectocopter = "connectocopter.cli:main"

[tool.setuptools.packages.find]
include = ["connectocopter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
